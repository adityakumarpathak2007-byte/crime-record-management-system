{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete - CRMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'officers/css/officers.css' %}">
</head>
<body>
<div class="navbar">
    <div class="nav-brand">🚔 Crime Record Management System</div>
   <div class="nav-right">
    <span>Logged in as <span class="username">{{ user.username }}</span></span>
    <span class="role-pill">{{ user.get_role_display }}</span>
    <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
</div>
</div>
<div class="confirm-box">
    <div class="confirm-icon">🗑️</div>
    <div class="confirm-title">Confirm Delete</div>
    <div class="confirm-subtitle">Are you sure you want to delete this Officer? This action cannot be undone.</div>
    <div class="record-name">{{ name }}</div>
    <div style="display:flex; gap:12px; justify-content:center;">
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
        </form>
        <a href="{% url 'officer_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</div>
</body>
</html>
