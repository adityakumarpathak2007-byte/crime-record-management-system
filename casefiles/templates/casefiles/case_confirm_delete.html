{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete - CRMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% load static %}
<link rel="stylesheet" href="{% static 'css/confirm_delete.css' %}">
</head>
<body>
    <div class="confirm-box">
        <div class="icon">🗑️</div>
        <div class="title">Confirm Delete</div>
        <div class="subtitle">Are you sure you want to delete this {{ type }}? This action cannot be undone.</div>
        <div class="record-name">{{ name }}</div>
        <div class="actions">
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
            </form>
            <a href="{% url 'case_list' %}" class="btn btn-cancel">Cancel</a>
        </div>
    </div>
</body>
</html>
